[project]
name = "swarmagent"
version = "0.8.0"
description = "SwarmAgent — multi-provider LLM agent with tool calling, caching, and streaming"
authors = [
    { name = "aryanShaw", email = "aryanrot234@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "ruff>=0.11.11",
    "groq>=1.6.0",
    "openai>=2.53.0",
    "anthropic>=0.121.0",
    "python-dotenv>=1.2.2",
    "langchain-core>=1.5.3",
]

[tool.pyright]
extraPaths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmagent"]
