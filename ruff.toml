# Enable flake8-bugbear (`B`) rules.
select = ["E", "F", "B", "I"]

# Set standard line length (e.g. 88 or 100) so multi-parameter definitions break across lines.
line-length = 150


# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.12
target-version = "py312"

[format]
# Enable trailing comma awareness and standard indentation
skip-magic-trailing-comma = false

[mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[isort]
known-third-party = []

